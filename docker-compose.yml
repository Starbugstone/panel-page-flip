# Every service here is scoped to one checkout. COMPOSE_PROJECT_NAME, the
# published ports and HOST_UID/HOST_GID all come from .env, which is untracked
# and written per checkout by scripts/dev-env.sh — run that before the first
# `docker compose` command in a new clone or worktree.
#
# Nothing sets container_name. Container names are global to the Docker daemon,
# so a literal name makes two checkouts fight over one container instead of
# getting one each; Compose derives unique names from the project instead.

networks:
  app_network:
    driver: bridge

services:
  # PHP service
  php:
    build:
      context: ./docker/php
      args:
        - PHP_VERSION=${PHP_VERSION:-8.2}
        - HOST_UID=${HOST_UID:-1000}
        - HOST_GID=${HOST_GID:-1000}
    # Runs as the host developer, so vendor/, var/ and public/uploads/ in the
    # bind mount below stay editable and deletable from the host.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./backend:/var/www/html
      # Symfony's cache is kept off the bind-mounted source tree. Rebuilding the
      # container renames the old directory aside and removes it, and on a
      # Windows or macOS bind mount that intermittently fails with "Directory
      # not empty" — which surfaces as a random functional test erroring out in
      # Kernel::initializeContainer() rather than as anything to do with the
      # test. A container-local volume gives it ordinary filesystem semantics.
      - php_cache:/var/www/html/var/cache
      - ./docker/php/setup.sh:/usr/local/bin/setup.sh:ro
    depends_on:
      - database
    environment:
      - MYSQL_USER=${MYSQL_USER:-cbz_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-cbz_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-cbz_reader}
      # One public origin from the root .env drives both Symfony and frontend SEO.
      - APP_URL=${APP_URL:-http://localhost:8080}
      # Reachable from inside the PHP container (APP_URL is the public/host URL).
      - APP_INTERNAL_URL=http://nginx
    # setup.sh is mounted read-only, so it is invoked through sh rather than
    # made executable in place.
    entrypoint: ["sh", "-c", "sh /usr/local/bin/setup.sh && php-fpm"]
    networks:
      - app_network

  # Nginx service (builds and serves frontend)
  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx_frontend/Dockerfile
      args:
        - NODE_VERSION=${NODE_VERSION:-22}
        - NGINX_VERSION=${NGINX_VERSION:-1.25}
        - APP_URL=${APP_URL:-http://localhost:8080}
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      # Read-only: nginx serves uploads and public assets and has no reason to
      # write into the checkout. Anything it did write would be nginx-owned.
      - ./backend:/var/www/html:ro
    depends_on:
      - php
    networks:
      - app_network

  # Database service
  database:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-cbz_reader}
      - MYSQL_USER=${MYSQL_USER:-cbz_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-cbz_password}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network

  adminer:
    image: adminer
    restart: always
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - database
    networks:
      - app_network

  # Mailpit for testing emails
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP server
      - "${MAILPIT_UI_PORT:-8025}:8025"   # Web UI
    networks:
      - app_network

  # Frontend Development Service
  frontend_dev:
    build:
      context: ./docker/frontend_dev
      args:
        - NODE_VERSION=${NODE_VERSION:-22}
        - HOST_UID=${HOST_UID:-1000}
        - HOST_GID=${HOST_GID:-1000}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./frontend:/app
      # Only the route generator, not all of scripts/: that directory can hold
      # .env.deploy with production FTP/SSH secrets.
      - ./scripts/generate-nginx-routes.mjs:/scripts/generate-nginx-routes.mjs:ro
      - ./backend/config/frontend-routes.json:/backend/config/frontend-routes.json:ro
      # Keeps the container's node_modules off the host's, which is built for
      # the host's platform and is also in use by the host test runs.
      - /app/node_modules
    working_dir: /app
    # `npm ci`, not `npm install`: /app is a bind mount of the source tree, so
    # `npm install` rewrites the tracked package-lock.json whenever the
    # container's npm differs from the one that wrote it. That lands as an
    # unexplained lockfile diff in `git status` every time the stack starts, and
    # it is the file CI installs from. This matches the nginx builder and CI.
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --force"
    ports:
      - "${FRONTEND_DEV_PORT:-3001}:3000"
    networks:
      - app_network
    depends_on:
      - nginx
    environment:
      - NODE_ENV=development
      - APP_URL=${APP_URL:-http://localhost:8080}
      - FRONTEND_ROUTES_FILE=/backend/config/frontend-routes.json
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

volumes:
  db_data:
  php_cache:
