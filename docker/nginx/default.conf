# Standalone Nginx config for a split deployment where the React build is
# mounted alongside the Symfony public directory.
#
# Not used by docker-compose, which builds docker/nginx_frontend instead and
# serves both from one image. Kept in step with that config so the two do not
# drift into disagreeing about routes or headers.
server {
    listen 80;
    server_name localhost;

    # Set the root for the Symfony application
    # This is where Nginx will look for index.php
    root /var/www/html/public;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;

    # Frontend React application (served from a different root). Unknown URLs
    # keep a real 404 status while the SPA renders its not-found page.
    error_page 404 /index.html;

    location = / {
        root /var/www/frontend_build;
        try_files /index.html =404;
    }

    location ~ ^/(?:login|forgot-password|email-verification|dashboard|upload|upload/bulk|settings|admin|admin/users/[^/]+|dropbox-sync|reset-password/[^/]+|read/[^/]+|share/accept/[^/]+)$ {
        root /var/www/frontend_build;
        # Repeated in full, not inherited: declaring any add_header in a
        # location replaces the whole set from the server block rather than
        # adding to it. Without these five, every signed-in page of the app —
        # the entire list above — was served with no CSP, no frame protection
        # and no HSTS.
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;
        add_header X-Robots-Tag "noindex, follow" always;
        try_files /index.html =404;
    }

    location / {
        root /var/www/frontend_build;
        try_files $uri $uri/ =404;
    }

    # API calls handled by Symfony
    # All requests starting with /api/ should go to Symfony's front controller
    location /api {
        try_files $uri /index.php$is_args$args;  # Uses server root: /var/www/html/public/index.php
    }

    # Main PHP processing block for Symfony
    # This should catch requests rewritten to index.php (e.g., from /api/login -> /index.php)
    # It will also catch direct calls to /index.php if any
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        internal; # Important: Only allow internal access to this PHP processing block
    }

    # Deny direct access to any other .php files
    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/project_error.log info;
    access_log /var/log/nginx/project_access.log;
}
