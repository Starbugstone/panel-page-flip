map $request_uri $ppf_request_path {
    ~^(?<ppf_path>[^?]*) $ppf_path;
}

# Keep provider authorization codes and other query values out of local logs,
# too; development credentials and callbacks still carry real secrets.
log_format ppf_without_query '$remote_addr - $remote_user [$time_local] '
    '"$request_method $ppf_request_path $server_protocol" $status $body_bytes_sent '
    '"$http_user_agent"';

server {
    listen 80;
    server_name localhost;
    
    # Increase upload size limits for comic files
    client_max_body_size 100M;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Strict CSP plus Vite's websocket. `$request_id` is also injected into each
    # initial script tag in the proxied HTML below.
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; img-src 'self' data: blob: https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com https://www.googletagmanager.com https://*.google-analytics.com; style-src 'self' 'unsafe-inline'; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com https://fundingchoicesmessages.google.com; connect-src 'self' https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://fundingchoicesmessages.google.com https://ep1.adtrafficquality.google https://ep2.adtrafficquality.google https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com ws: http://localhost:*; frame-ancestors 'none'; script-src 'nonce-$request_id' 'unsafe-inline' 'unsafe-eval' 'strict-dynamic' https: http:" always;

    sub_filter_once off;
    sub_filter '<script ' '<script nonce="$request_id" ';

    # Frontend development server
    location / {
        # Proxy to the Vite dev server running on port 3000
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        # sub_filter cannot rewrite a compressed body, and a script tag that
        # misses its nonce is one the policy above blocks outright.
        proxy_set_header Accept-Encoding "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Built from ADSENSE_CLIENT by Symfony rather than committed as a file: a
    # checked-in ads.txt is a copy of the publisher id that nothing keeps in
    # step, and a stale one names somebody else as entitled to sell this
    # domain's inventory. Absent (404) unless advertising is configured.
    location = /ads.txt {
        try_files $uri /index.php$is_args$args;
    }

    # API calls handled by Symfony backend
    location /api {
        try_files $uri /index.php$is_args$args;
    }

    # Main PHP processing block for Symfony
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        
        # Increase timeout for large file uploads
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        
        # Increase buffer size for file uploads
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        
        # Set the script filename to the Symfony public directory
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        internal;
    }

    # Deny direct access to any other .php files
    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/project_error.log warn;
    access_log /var/log/nginx/project_access.log ppf_without_query;
}
