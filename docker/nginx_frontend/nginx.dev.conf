server {
    listen 80;
    server_name localhost;
    
    # Increase upload size limits for comic files
    client_max_body_size 100M;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Mirrors docker/nginx_frontend/security-headers.conf plus what the Vite dev
    # server needs (inline scripts and its websocket). Development already
    # allows inline scripts, so an operator trying AdSense locally sees Auto Ads
    # behave as they would in production with the documented override applied —
    # see docs/advertising.md.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://partner.googleadservices.com https://tpc.googlesyndication.com https://www.googletagservices.com https://adservice.google.com https://fundingchoicesmessages.google.com; style-src 'self' 'unsafe-inline'; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com https://fundingchoicesmessages.google.com; connect-src 'self' ws: http://localhost:* https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://fundingchoicesmessages.google.com https://ep1.adtrafficquality.google https://ep2.adtrafficquality.google" always;

    # Frontend development server
    location / {
        # Proxy to the Vite dev server running on port 3000
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Built from ADSENSE_CLIENT by Symfony rather than committed as a file: a
    # checked-in ads.txt is a copy of the publisher id that nothing keeps in
    # step, and a stale one names somebody else as entitled to sell this
    # domain's inventory. Absent (404) unless advertising is configured.
    location = /ads.txt {
        try_files $uri /index.php$is_args$args;
    }

    # API calls handled by Symfony backend
    location /api {
        try_files $uri /index.php$is_args$args;
    }

    # Main PHP processing block for Symfony
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        
        # Increase timeout for large file uploads
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        
        # Increase buffer size for file uploads
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        
        # Set the script filename to the Symfony public directory
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        internal;
    }

    # Deny direct access to any other .php files
    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/project_error.log debug;
    access_log /var/log/nginx/project_access.log;
}
