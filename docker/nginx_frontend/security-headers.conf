# Security headers shared by the server block and every location that sets a
# header of its own.
#
# nginx's add_header is not additive across levels: a location that declares any
# add_header replaces the whole inherited set rather than adding to it. So the
# moment one location needs its own header, it silently loses all of these. This
# file exists so that adding a location header cannot quietly drop the rest —
# include it wherever you add one.

add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# The Google origins below are what AdSense and the Google CMP (Privacy &
# messaging) fetch from. They are listed unconditionally because the header is
# baked into the image, and they cost nothing on an installation with
# ADSENSE_ENABLED=false: no Google script is loaded there, so nothing ever
# reaches for them. Named origins rather than wildcards, so this stays a list
# somebody can audit.
#
# What is deliberately NOT here is script-src 'unsafe-inline'. Auto Ads and the
# CMP inject inline scripts, so an installation that turns advertising on will
# need either that or a per-response nonce — and neither belongs in a header
# every self-hosted, ad-free deployment inherits. docs/advertising.md carries the
# override and the trade-off.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com; script-src 'self' https://pagead2.googlesyndication.com https://partner.googleadservices.com https://tpc.googlesyndication.com https://www.googletagservices.com https://adservice.google.com https://fundingchoicesmessages.google.com; style-src 'self' 'unsafe-inline'; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com https://fundingchoicesmessages.google.com; connect-src 'self' https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://fundingchoicesmessages.google.com https://ep1.adtrafficquality.google https://ep2.adtrafficquality.google" always;
