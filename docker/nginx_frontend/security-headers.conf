# The default header set: everything in base-headers.conf plus the
# Google-capable Content-Security-Policy.
#
# Static nginx deployments use its cryptographically random request id as the
# per-response nonce. The server block injects the same value into every script
# in index.html. Google's documented compatibility tokens remain in script-src;
# on CSP3 browsers the nonce plus strict-dynamic supersedes unsafe-inline and the
# scheme sources. Non-script origins remain explicit and auditable.
#
# The Content-Security-Policy line is generated from backend/config/csp.json by
# scripts/generate-csp.mjs. Do not hand-edit it.

include /etc/nginx/snippets/base-headers.conf;

add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; img-src 'self' data: blob: https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com https://www.googletagmanager.com https://*.google-analytics.com; style-src 'self' 'unsafe-inline'; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com https://fundingchoicesmessages.google.com https://challenges.cloudflare.com; connect-src 'self' https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://fundingchoicesmessages.google.com https://ep1.adtrafficquality.google https://ep2.adtrafficquality.google https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; frame-ancestors 'none'; script-src 'nonce-$request_id' 'unsafe-inline' 'unsafe-eval' 'strict-dynamic' https: http: https://challenges.cloudflare.com" always;
