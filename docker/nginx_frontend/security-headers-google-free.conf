# The header set for the legal-policy routes.
#
# Google requires the privacy-policy URL configured in Privacy & Messaging to
# host neither the Funding Choices consent-message tag nor any other script
# requiring consent. The React providers already refuse to load anything Google
# on these routes; this is the second lock, so that a provider regression cannot
# quietly break a published policy commitment.
#
# No nonce and no strict-dynamic: a nonce is precisely what would let a trusted
# module pull descendants in. The Google ad, consent and measurement origins are
# also absent from img-src, frame-src and connect-src, so a tag that somehow ran
# here could not reach Google either.
#
# The Content-Security-Policy line is generated from backend/config/csp.json by
# scripts/generate-csp.mjs. Do not hand-edit it.

include /etc/nginx/snippets/base-headers.conf;

add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-src 'self' https://challenges.cloudflare.com; connect-src 'self'; frame-ancestors 'none'; script-src 'self' https://challenges.cloudflare.com" always;
