# The security headers that never vary by route.
#
# Split out of security-headers.conf so the Google-free legal routes can pair
# the same set with a different Content-Security-Policy without keeping a second
# copy of these four that nothing keeps in step.
#
# nginx's add_header is not additive across levels: a location that declares any
# add_header replaces the whole inherited set rather than adding to it. So the
# moment one location needs its own header, it silently loses all of these.
# Include one of the two security-headers files wherever you add a location
# header, never these four on their own.

add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
