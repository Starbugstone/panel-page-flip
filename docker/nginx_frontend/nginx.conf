map $request_uri $ppf_request_path {
    ~^(?<ppf_path>[^?]*) $ppf_path;
}

# OAuth authorization codes and other query values do not belong in request
# logs. Keep the useful method/path/status fields without recording arguments.
log_format ppf_without_query '$remote_addr - $remote_user [$time_local] '
    '"$request_method $ppf_request_path $server_protocol" $status $body_bytes_sent '
    '"$http_user_agent"';

server {
    listen 80;
    server_name localhost;
    
    # Increase upload size limits for comic files
    client_max_body_size 100M;

    include /etc/nginx/snippets/security-headers.conf;

    # Couple the per-request CSP nonce to every initial Vite script tag. Trusted
    # modules may then load AdSense/CMP through strict-dynamic.
    sub_filter_once off;
    sub_filter '<script ' '<script nonce="$request_id" ';

    # Root for the React frontend application (built into the image)
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Serve indexable landing page and known SPA routes. Unknown URLs keep a
    # real 404 status while still rendering the React not-found page.
    error_page 404 /index.html;

    # Generated at image-build time from the same manifest Symfony uses to
    # decide 200/404 and index/noindex behavior.
    include /etc/nginx/snippets/spa-routes.conf;

    # The CBR-to-CBZ helper scripts. Served as an attachment with a neutral
    # content type so no browser is tempted to render or hand off a script it
    # was only ever supposed to save.
    location ^~ /tools/ {
        include /etc/nginx/snippets/security-headers.conf;
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        try_files $uri =404;
    }

    # Built from ADSENSE_CLIENT by Symfony rather than committed as a file: a
    # checked-in ads.txt is a copy of the publisher id that nothing keeps in
    # step, and a stale one names somebody else as entitled to sell this
    # domain's inventory. Absent (404) unless advertising is configured.
    location = /ads.txt {
        try_files $uri /index.php$is_args$args;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # API calls handled by Symfony backend
    # All requests starting with /api/ should go to Symfony's front controller
    # The PHP service will look for files relative to /var/www/html/public
    location /api {
        # This rewrite changes /api/some/path to /index.php/some/path if /api/some/path doesn't exist as a file/dir
        # It effectively sends the request to be handled by Symfony's front controller.
        # The actual SCRIPT_FILENAME will be resolved in the ~ \.php$ block to /var/www/html/public/index.php
        try_files $uri /index.php$is_args$args;
    }

    # Main PHP processing block for Symfony
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        
        # Increase timeout for large file uploads
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        
        # Increase buffer size for file uploads
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        
        # Set the script filename to the Symfony public directory
        # $document_root here will be /usr/share/nginx/html (from the server block root),
        # so we hardcode the path to Symfony's public directory.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Ensure that script_name is correctly passed, e.g. /index.php not just index.php
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        internal; # Important: Only allow internal access to this PHP processing block
    }

    # Deny direct access to any other .php files in the frontend root
    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/project_error.log warn;
    access_log /var/log/nginx/project_access.log ppf_without_query;
}
