; Overrides the pool user from the base image's www.conf, which is www-data
; (uid 33). Runtime writes land in the bind-mounted source tree — public/uploads,
; var/log, the page cache — and uid 33 does not exist on the host, so anything
; www-data created was unreadable and undeletable from the host checkout.
[www]
user = www
group = www
listen.owner = www
listen.group = www
