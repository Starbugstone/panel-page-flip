# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    comics_directory: '%kernel.project_dir%/public/uploads/comics'
    quarantine_directory: '%kernel.project_dir%/var/quarantine/comics'
    # Generated page images, deliberately under var/ rather than public/: these
    # are derived from comics whose access is checked on every request, so they
    # must never be reachable by guessing a URL. Nothing here is authoritative
    # and the whole directory can be deleted at any time.
    page_cache_directory: '%kernel.project_dir%/var/page-cache'
    mailer_from_address: '%env(MAILER_FROM_ADDRESS)%'
    mailer_from_name: '%env(MAILER_FROM_NAME)%'
    privacy_operator_default: 'Panel Page Flip site operator'
    privacy_operator: '%env(default:privacy_operator_default:PRIVACY_OPERATOR)%'
    privacy_email: '%env(default:mailer_from_address:PRIVACY_EMAIL)%'
    legal_email: '%env(default:privacy_email:LEGAL_EMAIL)%'
    content_report_retention_days: '%env(int:default:content_report_retention_days_default:CONTENT_REPORT_RETENTION_DAYS)%'
    # On unless an installation says otherwise, so a deployment that never sets
    # it is protected rather than quietly unprotected. The local stack turns it
    # off in backend/.env; see LoginRateLimitSubscriber.
    login_rate_limit_enabled_default: true
    login_rate_limit_enabled: '%env(bool:default:login_rate_limit_enabled_default:LOGIN_RATE_LIMIT_ENABLED)%'
    content_report_retention_days_default: 730
    # The single source of truth for C-/G- code expiry. The service validates it
    # and refuses to build on a nonsense value, so a bad deployment fails on the
    # way up rather than minting codes that expired before they were handed out.
    share_content_code_ttl_days: '%env(int:default:share_content_code_ttl_days_default:SHARE_CONTENT_CODE_TTL_DAYS)%'
    share_content_code_ttl_days_default: 7
    # Where share invitation notices go. `sync://` unless an operator has a
    # Messenger worker running — see the transport comment in
    # config/packages/messenger.yaml for why that is the safe default.
    share_notification_transport_dsn_default: 'sync://'
    max_concurrent_uploads: '%env(int:default:max_concurrent_uploads_default:MAX_CONCURRENT_UPLOADS)%'
    max_concurrent_uploads_default: 4
    # How many files bulk upload sends at once. Deliberately separate from the
    # request budget above, which those files share: raising this alone cannot
    # put more requests in front of PHP-FPM than max_concurrent_uploads allows.
    max_parallel_file_uploads: '%env(int:default:max_parallel_file_uploads_default:MAX_PARALLEL_FILE_UPLOADS)%'
    max_parallel_file_uploads_default: 2
    upload_max_chunk_bytes: 2097152
    upload_max_total_bytes: 524288000
    upload_max_total_chunks: 600
    # Canonical source bytes each account may own unless an administrator sets
    # a per-user override. Zero deliberately means unlimited.
    upload_user_quota_bytes_default: 10737418240
    upload_user_quota_bytes: '%env(int:default:upload_user_quota_bytes_default:UPLOAD_USER_QUOTA_BYTES)%'
    # The optional qpdf second opinion on a PDF's structure, as a per-document
    # time budget. It costs about 0.4s per megabyte, so 8 seconds admits
    # documents up to roughly 20 MB and skips the large scans where the check
    # could not finish anyway. Zero disables it: the check has always been
    # optional, and a host without qpdf imports PDFs on the Poppler checks
    # alone. See docs/comic-formats.md.
    pdf_structure_check_budget_seconds: '%env(float:default:pdf_structure_check_budget_default:PDF_STRUCTURE_CHECK_BUDGET_SECONDS)%'
    pdf_structure_check_budget_default: 8.0
    # What that check costs per megabyte on this host. It is a property of the
    # hardware rather than of the application — a slower disk or a busier CPU
    # changes it — and the default was measured on a development container, so
    # it is the number most worth correcting on a real server. Together with the
    # budget above it decides the largest document that gets checked:
    # budget / rate = megabytes. `app:comic-formats:check` reports that figure.
    pdf_structure_check_seconds_per_megabyte: '%env(float:default:pdf_structure_check_rate_default:PDF_STRUCTURE_CHECK_SECONDS_PER_MEGABYTE)%'
    pdf_structure_check_rate_default: 0.4
    # The application is same-origin in production. One public URL drives
    # absolute email/OAuth links, CLI routing and generated SEO metadata.
    app_url: '%env(APP_URL)%'
    dropbox_app_folder: '%env(DROPBOX_APP_FOLDER)%'
    dropbox_sync_limit: '%env(int:DROPBOX_SYNC_LIMIT)%'
    dropbox_rate_limit: '%env(int:DROPBOX_RATE_LIMIT)%'
    app_data_key: '%env(APP_DATA_KEY)%'
    # The operator's final word on the provider integrations. Nothing inside the
    # application can override these, which is the point of putting them out
    # here.
    #
    # Shared Metron is off by default: it spends an account the installation
    # owns, so it is opted into rather than inherited from a shipped default.
    #
    # Comic Vine is on by default. This is self-hosted software and its ordinary
    # deployment is a person's own library, which is squarely inside Comic Vine's
    # non-commercial terms; a deployment that leaves those terms turns it off
    # here or in the admin panel. Shipping it disabled would mean every operator
    # had to discover a switch to get behaviour they were already entitled to.
    env(METRON_SHARED_ENABLED): 'false'
    env(COMIC_VINE_SHARED_ENABLED): 'true'
    metron_shared_enabled: '%env(bool:METRON_SHARED_ENABLED)%'
    comic_vine_shared_enabled: '%env(bool:COMIC_VINE_SHARED_ENABLED)%'
    # Advertising. Two settings, because everything else AdSense can be told —
    # which formats run, which pages are excluded, whether an Offerwall appears —
    # is configured in the AdSense account. See docs/advertising.md.
    #
    # Off unless an operator turns it on: the ordinary deployment of this
    # software is somebody's own library, which has no publisher account and no
    # reason to load a third-party script.
    env(ADSENSE_ENABLED): 'false'
    env(ADSENSE_CLIENT): ''
    adsense_enabled: '%env(bool:ADSENSE_ENABLED)%'
    adsense_client: '%env(ADSENSE_CLIENT)%'
    # Daily log files live under these, one folder per stream. Security and
    # audit files are grouped into YYYY/MM/ because a year of them at one file
    # per day is several hundred entries in a single listing.
    app_log_directory: '%kernel.logs_dir%/app'
    security_log_directory: '%kernel.logs_dir%/security'
    audit_log_directory: '%kernel.logs_dir%/audit'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    _instanceof:
        App\ComicSource\ComicPageProviderInterface:
            tags: ['app.comic_page_provider']
        App\ComicSource\ComicInfoSourceInterface:
            tags: ['app.comic_info_source']
        App\Metadata\Provider\MetadataProviderInterface:
            tags: ['app.metadata_provider']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # ---------------------------------------------------------------------
    # Security and audit logging
    # ---------------------------------------------------------------------

    # Pushed onto the logger prototype rather than onto one handler, so it runs
    # for every channel. Redaction that only covered the security log would miss
    # the credential that leaks from an exception context in `main`.
    App\Monolog\SensitiveDataProcessor:
        tags:
            - { name: monolog.processor }

    app.monolog.app_handler:
        class: App\Monolog\DailyFolderHandler
        arguments:
            $directory: '%app_log_directory%'
            $groupByMonth: false
            $level: 'debug'

    app.monolog.security_handler:
        class: App\Monolog\DailyFolderHandler
        arguments:
            $directory: '%security_log_directory%'
            $groupByMonth: true
            $level: 'info'

    app.monolog.audit_handler:
        class: App\Monolog\DailyFolderHandler
        arguments:
            $directory: '%audit_log_directory%'
            $groupByMonth: true
            $level: 'info'

    # The two channels this feature owns. Autowiring resolves LoggerInterface to
    # the default channel, so without these the security records would go to
    # `main` and the split configured in monolog.yaml would do nothing.
    App\Service\SecurityAuditLogger:
        arguments:
            $securityLogger: '@monolog.logger.app_security'
            $auditLogger: '@monolog.logger.app_audit'

    App\Service\SecurityAlertService:
        arguments:
            $securityAlertCache: '@security.alert.cache'

    # ---------------------------------------------------------------------


    # Reset password service with mailer configuration
    App\Service\ResetPasswordService:
        arguments:
            $mailerFromAddress: '%mailer_from_address%'
            $mailerFromName: '%mailer_from_name%'

    App\Service\EmailVerificationMailer:
        arguments:
            $mailerFromAddress: '%mailer_from_address%'
            $mailerFromName: '%mailer_from_name%'

    App\Service\ShareContentCodeLifetime:
        arguments:
            $contentCodeTtlDays: '%share_content_code_ttl_days%'

    App\Service\AppDataEncryptionService:
        arguments:
            $appDataKey: '%app_data_key%'

    App\Service\DropboxClientFactory:
        arguments:
            $dropboxAppKey: '%env(DROPBOX_APP_KEY)%'
            $dropboxAppSecret: '%env(DROPBOX_APP_SECRET)%'

    App\Service\ApiRateLimiter:
        arguments:
            $loginLimiter: '@limiter.login'
            $registerLimiter: '@limiter.register'
            $forgotPasswordLimiter: '@limiter.forgot_password'
            $verificationResendLimiter: '@limiter.verification_resend'
            $comicSearchLimiter: '@limiter.comic_search'

    App\EventSubscriber\LoginRateLimitSubscriber:
        arguments:
            $enabled: '%login_rate_limit_enabled%'

    App\Service\ComicShareService:
        arguments:
            $shareInvitationLimiter: '@limiter.share_invitation'

    App\Controller\ContentReportController:
        arguments:
            $contentReportLimiter: '@limiter.content_report'
            
    # Test mail command with mailer configuration
    App\Command\TestMailCommand:
        arguments:
            $mailerFromAddress: '%mailer_from_address%'
            $mailerFromName: '%mailer_from_name%'
            
    # Comic service with comics directory configuration
    App\Service\StorageQuotaService:
        arguments:
            $uploadUserQuotaBytes: '%upload_user_quota_bytes%'

    App\Service\ComicService:
        arguments:
            $comicsDirectory: '%comics_directory%'
            $uploadMaxTotalBytes: '%upload_max_total_bytes%'

    App\ComicSource\ComicPageProviderFactory:
        arguments:
            $providers: !tagged_iterator app.comic_page_provider

    App\ComicSource\ComicInfoSourceFactory:
        arguments:
            $sources: !tagged_iterator app.comic_info_source

    App\Service\MetadataProviderRegistry:
        arguments:
            $providers: !tagged_iterator app.metadata_provider

    # Narrow seams onto the two credential stores. Whatever decides who may
    # spend an allowance sees the tokens and the switches, and never the
    # entities or the manager behind them.
    App\Metadata\Provider\SharedProviderCredentials: '@App\Service\MetadataProviderConfigurationService'
    App\Metadata\Provider\PersonalProviderCredentials: '@App\Service\UserMetadataCredentialService'

    App\Service\MetadataAccessResolver:
        arguments:
            $metronSharedAllowedByEnvironment: '%metron_shared_enabled%'
            $comicVineSharedAllowedByEnvironment: '%comic_vine_shared_enabled%'

    App\Service\ProviderCircuitBreaker:
        arguments:
            $cache: '@metadata.provider.cache'
            $logger: '@logger'

    App\Service\ProviderQuotaTracker:
        arguments:
            $cache: '@metadata.provider.cache'

    App\Metadata\Provider\MetronProvider:
        arguments:
            $metadataProviderLimiter: '@limiter.metadata_provider'
            $cache: '@metadata.provider.cache'

    App\Metadata\Provider\ComicVineProvider:
        arguments:
            $metadataProviderLimiter: '@limiter.metadata_provider'
            $cache: '@metadata.provider.cache'

    App\ComicSource\ZipPageProvider:
        arguments:
            $pageIndexCache: '@comic.page_index.cache'

    App\ComicSource\SevenZipPageProvider:
        arguments:
            $pageIndexCache: '@comic.page_index.cache'

    App\ComicSource\PdfPageProvider:
        arguments:
            $pageIndexCache: '@comic.page_index.cache'
            $logger: '@logger'

    App\Service\ComicFormatService:
        arguments:
            $availabilityCache: '@comic.format_availability.cache'

    App\Service\ComicPageCache:
        arguments:
            $directory: '%page_cache_directory%'
            $logger: '@logger'

    App\Service\ComicPageDelivery:
        arguments:
            $logger: '@logger'

    App\Service\PageDerivativeService:
        arguments:
            $logger: '@logger'

    App\Service\ComicCleanupService:
        arguments:
            $comicsDirectory: '%comics_directory%'

    App\Service\FileQuarantineService:
        arguments:
            $managedDirectory: '%comics_directory%'
            $quarantineDirectory: '%quarantine_directory%'

    App\Service\PendingFileDeletionService:
        arguments:
            $allowedRoots:
                - '%quarantine_directory%'

    # Comic controller with comics directory configuration
    App\Controller\ComicUploadController:
        arguments:
            $uploadMaxChunkBytes: '%upload_max_chunk_bytes%'
            $uploadMaxTotalBytes: '%upload_max_total_bytes%'
            $uploadMaxTotalChunks: '%upload_max_total_chunks%'

    App\Controller\ComicPageController:
        arguments:
            $comicsDirectory: '%comics_directory%'


    App\Service\DropboxImportService:
        arguments:
            $dropboxAppFolder: '%dropbox_app_folder%'

    App\Controller\DropboxController:
        arguments:
            $dropboxAppKey: '%env(DROPBOX_APP_KEY)%'
            $dropboxAppSecret: '%env(DROPBOX_APP_SECRET)%'
            $dropboxRedirectUri: '%env(DROPBOX_REDIRECT_URI)%'
            $dropboxSyncLimit: '%dropbox_sync_limit%'

    App\Command\DropboxSyncCommand:
        arguments:
            $defaultSyncLimit: '%dropbox_sync_limit%'

    App\Command\BackfillComicFileSizeCommand:
        arguments:
            $comicsDirectory: '%comics_directory%'
