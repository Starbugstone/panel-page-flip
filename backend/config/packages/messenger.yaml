framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

            # Share invitation notices, and the only transport this application
            # actually routes anything to.
            #
            # `sync://` by default, deliberately. Nothing in this application
            # has ever put a message on `async` — the mailer routing above is
            # commented out — so an installation that upgrades into a queued
            # notice without also gaining a worker would create shares and
            # silently never tell anybody, which is a worse failure than the one
            # the queue was introduced to fix. Receiving mail today is not
            # evidence that a worker is running; it is evidence that it is not
            # needed yet.
            #
            # What the redesign actually needs is that the notice is dispatched
            # *after* the shares commit, and that holds either way: sync runs
            # the handler inline, a failure marks the share's notification state
            # and is recoverable with Resend, and the share survives. What async
            # adds is automatic retry and a response that does not wait for
            # SMTP.
            #
            # Set SHARE_NOTIFICATION_TRANSPORT_DSN to the doctrine DSN once
            # `messenger:consume share_notifications` is running. See
            # SSH-deploy.md §7.3.
            share_notifications: '%env(default:share_notification_transport_dsn_default:SHARE_NOTIFICATION_TRANSPORT_DSN)%'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            # Comment out this line to send emails synchronously
            # Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # Telling somebody about a share they have already been given. The
            # message carries share ids and nothing else — the worker reloads
            # the relationships and mints the invitation links at the moment it
            # sends them — so no plaintext bearer token is written to the queue,
            # retried through it, or left in the failure transport for an
            # operator to read.
            App\Message\ShareInvitationNotification: share_notifications

when@test:
    framework:
        messenger:
            transports:
                # Pinned rather than inherited, so a test still runs the handler
                # inline on an installation that has switched the real transport
                # to a queue. The production path is unchanged either way: the
                # notice is dispatched after the commit, and carries only ids.
                share_notifications: 'sync://'
                async: 'sync://'
