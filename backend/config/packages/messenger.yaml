framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            # Comment out this line to send emails synchronously
            # Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # Telling somebody about a share they have already been given. The
            # message carries share ids and nothing else — the worker reloads
            # the relationships and mints the invitation links at the moment it
            # sends them — so no plaintext bearer token is written to the queue,
            # retried through it, or left in the failure transport for an
            # operator to read.
            App\Message\ShareInvitationNotification: async

when@test:
    framework:
        messenger:
            transports:
                # Handled inline, so a test that asserts what lands in somebody's
                # inbox does not have to run a worker. The production path is
                # unchanged: the notice is still dispatched after the commit,
                # and still carries only ids.
                async: 'sync://'
