framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Namespaced pools use the above "app" backend by default
        pools:
            # The sorted list of image entries inside each comic archive, keyed
            # by path, mtime and size. Its own pool so that reading comics can
            # never evict application data, and so the whole index can be
            # cleared without touching anything else.
            comic.page_index.cache:
                adapter: cache.app
                default_lifetime: 86400

            # Whether this server's comic-format runtimes are present. Probing
            # shells out to 7z, so it is not something to redo on every upload
            # and every configuration fetch. Short-lived, and the admin panel's
            # Verify button recomputes it immediately, so installing a package
            # never leaves an administrator staring at a stale "Unavailable".
            comic.format_availability.cache:
                adapter: cache.app
                default_lifetime: 300

            # Answers from the external metadata providers, keyed by the query
            # rather than by the comic, so two comics asking the same question
            # cost one lookup. Its own pool because these are the only entries
            # whose absence costs an outbound request against somebody else's
            # rate limit.
            metadata.provider.cache:
                adapter: cache.app
                default_lifetime: 86400

            # One batch's worth of bulk-upload access, per account. Its own
            # pool so that clearing a page-index or provider cache cannot end
            # every batch in progress, and so a session outlives nothing it
            # should: the lifetime here is a ceiling, and the service writes its
            # own shorter expiry on every entry.
            upload.bulk_session.cache:
                adapter: cache.app
                default_lifetime: 7200

            # Threshold counters and cooldowns for administrator security
            # alerts. Its own pool so that clearing an application cache cannot
            # reset every cooldown at once and let a burst of alerts through,
            # and so the counters survive a page-index purge.
            security.alert.cache:
                adapter: cache.app
                default_lifetime: 3600
