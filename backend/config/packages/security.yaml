security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        App\Entity\User: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # users_in_memory: { memory: null }
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email # The field used to look up users
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider

            # Rejects unverified accounts during authentication rather than
            # after it. Checking in the success handler cannot work: the token
            # is stored before that handler runs, so its 403 shipped alongside
            # a working session cookie.
            user_checker: App\Security\UserChecker

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

            # Form login
            # form_login:
            #     # "app_login" is the name of the route created previously
            #     login_path: app_login
            #     check_path: app_login
            #     enable_csrf: true
            
            json_login:
                check_path: /api/login # The user will POST to this URI
                username_path: email
                password_path: password
                # Using custom handlers for better JSON responses
                success_handler: App\Security\AuthenticationSuccessHandler
                failure_handler: App\Security\AuthenticationFailureHandler

            custom_authenticators:
                - App\Security\OAuthAuthenticator


    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # Public routes (no authentication required)
        - { path: ^/api/login$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api/register$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api/login_check$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/forgot-password$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: '^/api/reset-password/validate/[A-Fa-f0-9]{64}$', methods: [GET], roles: PUBLIC_ACCESS }
        - { path: '^/api/reset-password/reset/[A-Fa-f0-9]{64}$', methods: [POST], roles: PUBLIC_ACCESS }
        - { path: '^/api/email-verification/verify/[A-Fa-f0-9]{64}$', methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/email-verification/resend$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/providers$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: '^/api/auth/oauth/[^/]+/(start|callback)$', methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/oauth/pending$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/oauth/complete-registration$, methods: [POST], roles: PUBLIC_ACCESS }
        # Whether this installation shows advertising, needed by the landing and
        # login pages before anybody has signed in. Nothing account-specific.
        - { path: ^/api/public-config$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/content-reports$, methods: [POST], roles: PUBLIC_ACCESS }
        # Reading an invitation is public so somebody who does not have an
        # account yet can see what they are being offered before creating one.
        # It is a GET that changes nothing; accepting and declining are POSTs on
        # longer paths, which this pattern deliberately does not match.
        - { path: '^/api/shares/invitations/[^/]+$', methods: [GET], roles: PUBLIC_ACCESS }
        # Registration has to offer a username and check one before an account
        # exists, so both are public — and both are rate limited per IP inside
        # the controller, because availability is the one place an
        # unauthenticated caller can ask whether a name is in use.
        - { path: ^/api/users/username-suggestion$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/users/username-available$, methods: [GET], roles: PUBLIC_ACCESS }
        # These live under /api/users but belong to the account holder, not to
        # an administrator, so they are listed ahead of the admin rule below.
        - { path: ^/api/users/resolve-username$, methods: [POST], roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/users/username$, methods: [PUT], roles: IS_AUTHENTICATED_FULLY }

        # Admin routes (all methods). Not anchored on the id, so sub-resources
        # such as /api/users/{id}/verify and /api/users/{id}/user-code/rotate
        # are covered by the firewall as well as by their own in-controller
        # check, rather than falling through to plain authentication.
        - { path: ^/api/users(/|$), roles: ROLE_ADMIN }
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        
        # The frontend probes this endpoint on every public page. Absence of a
        # session is a normal state for GET, while POST remains the protected
        # keep-alive operation.
        - { path: ^/api/me$, methods: [GET], roles: PUBLIC_ACCESS }

        # User routes (require authentication)
        - { path: ^/api/me$, roles: IS_AUTHENTICATED_FULLY }
        
        # Secure everything else by default
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            App\Entity\User:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
