framework:
    rate_limiter:
        login:
            policy: fixed_window
            limit: 5
            interval: '15 minutes'
        register:
            policy: fixed_window
            limit: 3
            interval: '1 hour'
        forgot_password:
            policy: fixed_window
            limit: 5
            interval: '1 hour'
        verification_resend:
            policy: fixed_window
            limit: 5
            interval: '1 hour'
        # Invitation sends and resends, per owner. Sliding rather than fixed so
        # the allowance cannot be doubled by sending across a window boundary.
        #
        # Deliberately not lowered under when@test: the limit is small enough to
        # exercise from a functional test, and no other test sends more than two
        # invitations from one owner.
        share_invitation:
            policy: sliding_window
            limit: 10
            interval: '1 hour'

when@test:
    framework:
        rate_limiter:
            login:
                limit: 1000
            register:
                limit: 1000
            forgot_password:
                limit: 1000
            verification_resend:
                limit: 1000
