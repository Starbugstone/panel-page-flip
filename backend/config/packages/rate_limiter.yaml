framework:
    rate_limiter:
        login:
            policy: fixed_window
            limit: 5
            interval: '15 minutes'
        register:
            policy: fixed_window
            limit: 3
            interval: '1 hour'
        forgot_password:
            policy: fixed_window
            limit: 5
            interval: '1 hour'
        verification_resend:
            policy: fixed_window
            limit: 5
            interval: '1 hour'
        # OAuth redirects are intentionally generous human-retry ceilings. The
        # callback limit also bounds authorization-code exchanges against the
        # upstream provider.
        oauth_start:
            policy: sliding_window
            limit: 20
            interval: '15 minutes'
        oauth_callback:
            policy: sliding_window
            limit: 20
            interval: '15 minutes'
        oauth_registration:
            policy: fixed_window
            limit: 5
            interval: '1 hour'
        content_report:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        content_report_burst:
            policy: sliding_window
            limit: 2
            interval: '1 minute'
        content_report_acknowledgement:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        comic_search:
            policy: sliding_window
            limit: 10
            interval: '1 minute'
        # Invitation sends and resends, per owner. Sliding rather than fixed so
        # the allowance cannot be doubled by sending across a window boundary.
        #
        # Deliberately not lowered under when@test: the limit is small enough to
        # exercise from a functional test, and no other test sends more than two
        # invitations from one owner.
        share_invitation:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        # Sharing codes are the only place an identifier somebody typed is
        # turned into a person, so this is the only enumeration surface the
        # sharing feature has. Charged per lookup that finds nothing, so
        # pasting a code never meets it and grinding through candidates does.
        # Sixty bits of entropy is what actually makes guessing hopeless; this
        # is the ceiling that stops anybody trying at scale.
        sharing_code_lookup:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        # Creating a claim code sends no mail, so the invitation limiter is the
        # wrong control for it — but a code handed out ten times at a time is
        # still access leaving the account, and it deserves a ceiling of its
        # own. Redemption attempts that fail are charged against the lookup
        # limiter above, for the same reason.
        share_claim_code:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        # Replacing a receiver code is cheap for the account doing it and
        # expensive for everybody holding the old one, so this is not about
        # load — it is about a script or a stuck retry quietly making somebody
        # uncontactable. Generous enough that a person who rotates, mistypes
        # the new code to a friend and rotates again never notices it.
        sharing_code_rotation:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        # The other end of the same problem, and the harder one. A username is
        # short, memorable and chosen, so unlike a sixty-bit code it is a name
        # somebody could plausibly guess — which makes this limit the control
        # that actually does the work rather than a backstop behind entropy.
        # Charged per miss, so sharing with the people you know is free.
        username_lookup:
            policy: sliding_window
            limit: 30
            interval: '1 hour'
        # Changing a handle other people have written down is an identity
        # change, and one that can be done freely is one that can be done
        # *into*: taking a name somebody has just vacated is the cheapest
        # impersonation there is. Generous enough that somebody settling on a
        # name they like never notices it.
        username_change:
            policy: sliding_window
            limit: 3
            interval: '24 hours'
        # Charged for *every* attempt to turn an identifier into a person —
        # username, `U-` code, `C-`/`G-` redemption — and charged before the
        # repository is asked anything.
        #
        # The miss-only allowances above cannot do this job alone. Once one of
        # them is exhausted a known identifier still resolves and an unknown one
        # is refused, which is precisely the existence oracle they exist to
        # prevent: the difference between the two answers is the answer. So this
        # runs first and does not care whether the lookup would have succeeded.
        #
        # Deliberately loose. It is the ceiling that keeps an exhausted caller
        # away from the database, not the control that makes guessing hopeless —
        # that is entropy for a code, and the tighter miss-only allowance for a
        # username. Somebody sharing all afternoon must never meet it.
        identifier_lookup:
            policy: sliding_window
            limit: 240
            interval: '1 hour'

        # Outbound lookups against the external metadata providers. Their own
        # documented limits are what this protects: Comic Vine refuses a client
        # that exceeds 200 requests an hour, and being cut off costs every user
        # of this installation, not just the one who triggered it. Sliding so
        # the allowance cannot be doubled across a window boundary.
        metadata_provider:
            policy: sliding_window
            limit: 150
            interval: '1 hour'

        # Per-user fairness, separate from the ceiling above. The provider limit
        # protects the upstream account; this protects the other people sharing
        # it, so one enthusiastic library cannot spend the installation's whole
        # allowance before anybody else opens an editor.
        metadata_provider_user:
            policy: sliding_window
            limit: 40
            interval: '1 hour'

when@test:
    framework:
        rate_limiter:
            login:
                limit: 1000
            register:
                limit: 1000
            forgot_password:
                limit: 1000
            verification_resend:
                limit: 1000
            oauth_start:
                limit: 1000
            oauth_callback:
                limit: 1000
            oauth_registration:
                limit: 1000
            comic_search:
                limit: 1000
            # Raised because the limiter is cache-backed while the database is
            # rolled back between tests: user ids come round again and inherit
            # an allowance a previous test spent. No test asserts this limit —
            # the ones that do assert a limit are written to tolerate arriving
            # at a key somebody else already used.
            share_claim_code:
                limit: 1000
            # Deliberately not raised. Both are small enough to exercise from a
            # functional test, and both are the control that actually does the
            # work for their surface rather than a backstop behind entropy — so
            # a test that proves the allowance runs out is worth more than the
            # convenience of an unlimited one. The base class clears the
            # limiter cache per test, so a recurring user id starts fresh.
            #
            # Provider lookups are cache-backed like the others, so raise it
            # rather than have an unrelated test spend the allowance.
            metadata_provider:
                limit: 1000
            metadata_provider_user:
                limit: 1000
