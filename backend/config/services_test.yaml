parameters:
    # Never let the test suite share an upload tree with the running app. Tests
    # create and delete files under these paths, and pointing them at
    # public/uploads puts real comics within reach of a test's cleanup.
    comics_directory: '%kernel.project_dir%/var/test-uploads/comics'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Rate-limiter state lives in a cache pool that outlives the database, so a
    # recycled user id would inherit whatever allowance the previous run had
    # already spent — and the suite would pass once, then fail on a re-run.
    # In-memory storage is per kernel, so each test starts from a clean
    # allowance and the limits can still be exercised within one test.
    limiter.storage.share_invitation:
        class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

    # Alert thresholds and cooldowns must not outlive the run that set them. The
    # real pool is filesystem-backed and survives the database, so a cooldown
    # claimed by one run would suppress the alert the next run asserts on — the
    # same trap as the rate-limiter storage above. In-memory, per kernel, and
    # not cleared between requests, because counting across requests is the
    # mechanism being tested.
    security.alert.cache:
        class: App\Tests\Support\PersistentArrayCache
        public: true

    # In-memory handlers for the security and audit channels, so a test can read
    # back exactly what a real handler would have been given — after the
    # processors, which is the only way to assert that redaction happens in the
    # pipeline rather than in the caller.
    app.monolog.test_security_handler:
        class: App\Tests\Support\AccumulatingTestHandler
        public: true

    app.monolog.test_audit_handler:
        class: App\Tests\Support\AccumulatingTestHandler
        public: true

    # Fetched directly by the tests covering throttling and the disable switch.
    App\Service\SecurityAlertService:
        public: true
        arguments:
            $securityAlertCache: '@security.alert.cache'

    App\Tests\:
        resource: '../tests/'
        exclude:
            - '../tests/bootstrap.php'

    # Sharing's notification guarantees are about what happens when a send
    # fails, and the cases worth proving go through a real HTTP request. A
    # service cannot be swapped once the container has initialised it, so the
    # substitution is permanent here and switched off by default — see
    # App\Tests\Support\SwitchableMailer.
    App\Tests\Support\SwitchableMailer:
        decorates: mailer.mailer
        arguments:
            $inner: '@.inner'
