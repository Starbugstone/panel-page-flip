name: Apply Issue 119 Deploy Fixes

on:
  push:
    branches:
      - agent/fix-deploy-pipeline-gaps

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply deploy fixes
        run: python3 .github/agent/apply_issue_119.py

      - name: Validate shell syntax and routing invariants
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-release.sh
          bash -n scripts/deploy-ftp.sh
          bash -n scripts/post-deploy.sh
          grep -q 'RewriteCond %{REQUEST_URI} !^/api' scripts/deploy/htaccess.dist
          grep -q 'git fetch --quiet origin main' scripts/build-release.sh
          grep -q 'Generated asset cleanup: enabled' scripts/deploy-ftp.sh
          grep -q 'Smoke checks passed' scripts/post-deploy.sh

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-release.sh scripts/deploy-ftp.sh scripts/post-deploy.sh scripts/deploy/htaccess.dist
          git diff --cached --check
          git commit -m "Harden production deploy pipeline"
          git push origin HEAD:agent/fix-deploy-pipeline-gaps
