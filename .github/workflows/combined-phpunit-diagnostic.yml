name: Combined PHPUnit Diagnostic

on:
  push:
    branches: [ci/combined-phpunit-diagnostic-117-118]

permissions:
  contents: read

jobs:
  combined-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge PR 118 and resolve the known subscriber conflict
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "integration-diagnostic"
          git config user.email "integration-diagnostic@users.noreply.github.com"
          git fetch origin agent/issue-116-hardening
          set +e
          git merge --no-commit --no-ff origin/agent/issue-116-hardening
          merge_code=$?
          set -e
          if [ "$merge_code" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            expected="backend/src/EventSubscriber/MetadataProviderSecretsSubscriber.php"
            if [ "$conflicts" != "$expected" ]; then
              echo "::error title=Unexpected merge conflicts::$conflicts"
              exit 1
            fi
            git checkout --ours -- "$expected"
            git add "$expected"
          fi
          git diff --check --cached
          git commit -m "Temporary combined integration merge"

      - name: Start PHP and database containers
        run: docker compose up -d --build database php

      - name: Wait for MySQL
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if docker compose exec -T database sh -lc 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent'; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs database
          exit 1

      - name: Install backend dependencies
        run: docker compose exec -T php composer install --no-interaction --no-progress

      - name: Create isolated test database
        run: |
          docker compose exec -T database sh -lc 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "CREATE DATABASE IF NOT EXISTS ${MYSQL_DATABASE}_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON ${MYSQL_DATABASE}_test.* TO '\''${MYSQL_USER}'\''@'\''%'\''; FLUSH PRIVILEGES;"'

      - name: Apply test migrations
        run: docker compose exec -T php php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Capture memory limits before PHPUnit
        shell: bash
        run: |
          echo "Runner memory:"
          free -m
          echo "PHP memory_limit:"
          docker compose exec -T php php -r 'echo ini_get("memory_limit"), PHP_EOL;'
          echo "Container state:"
          docker inspect "$(docker compose ps -q php)" --format '{{json .State}}'
          echo "Container stats:"
          docker stats --no-stream

      - name: Run combined PHPUnit with debug diagnostics
        shell: bash
        run: |
          set +e
          docker compose exec -T php php bin/phpunit --debug > /tmp/phpunit-debug.log 2>&1
          code=$?
          set -e

          echo "PHPUnit exit code: $code"
          echo "--- PHPUnit diagnostic tail ---"
          tail -n 120 /tmp/phpunit-debug.log || true
          echo "--- Runner memory after PHPUnit ---"
          free -m || true
          echo "--- Container state after PHPUnit ---"
          docker inspect "$(docker compose ps -q php)" --format '{{json .State}}' || true
          echo "--- Container stats after PHPUnit ---"
          docker stats --no-stream || true

          tail_text="$(tail -n 55 /tmp/phpunit-debug.log 2>/dev/null || true)"
          escaped="${tail_text//'%'/'%25'}"
          escaped="${escaped//$'\r'/'%0D'}"
          escaped="${escaped//$'\n'/'%0A'}"
          echo "::error title=Combined PHPUnit exit $code::$escaped"

          exit "$code"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs
