name: Apply Issue 116 Hardening

on:
  push:
    branches:
      - agent/issue-116-hardening

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, gd, iconv, intl, mbstring, pdo_mysql, sodium, xsl, zip, zlib
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/agent/apply_issue_116.py
          python3 .github/agent/post_patch_fix.py

      - name: Update Composer dependency set
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          composer remove symfony/asset symfony/asset-mapper symfony/stimulus-bundle symfony/ux-turbo phpdocumentor/reflection-docblock phpstan/phpdoc-parser --no-interaction --no-scripts
          composer require --dev phpstan/phpstan:^2.1 friendsofphp/php-cs-fixer:^3.80 --no-interaction --no-scripts
          composer dump-autoload --no-interaction --no-scripts
          printf '%s\n' 'parameters:' '    level: 6' '    paths:' '        - src' '    treatPhpDocTypesAsCertain: false' > phpstan.generate.neon
          vendor/bin/phpstan analyse -c phpstan.generate.neon --generate-baseline=phpstan-baseline.neon --no-progress || true
          test -s phpstan-baseline.neon
          rm phpstan.generate.neon

      - name: Validate Symfony container early
        shell: bash
        run: |
          set +e
          cd backend
          php bin/console cache:clear > ../.github/agent/cache-clear-error.txt 2>&1
          rc=$?
          cd ..
          if [ "$rc" -ne 0 ]; then
            cat .github/agent/cache-clear-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/agent/cache-clear-error.txt
            git commit -m "Capture hardening cache diagnostic"
            git push origin HEAD:agent/issue-116-hardening
            exit "$rc"
          fi
          rm -f .github/agent/cache-clear-error.txt

      - name: Validate frontend
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm ci --ignore-scripts --no-audit --no-fund
          npm run audit:production
          npm run lint
          npm run test
          npm run check:routes
          npm run check:tools
          APP_URL=https://comics.starbugstone.com VITE_BUILD_ID=issue-116 VITE_BUILD_TIME=2026-08-15T11:15:00+02:00 npm run build
          APP_URL=https://comics.starbugstone.com npm run check:seo

      - name: Start backend and database
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --build database php
          for attempt in {1..60}; do
            if docker compose exec -T database sh -lc 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent'; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs database
          exit 1

      - name: Install backend dependencies without scripts
        run: docker compose exec -T php composer install --no-interaction --no-progress --no-scripts

      - name: Clear Symfony cache
        run: docker compose exec -T php php bin/console cache:clear

      - name: Install Symfony assets
        run: docker compose exec -T php php bin/console assets:install public

      - name: Prepare and migrate test database
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T database sh -lc 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "CREATE DATABASE IF NOT EXISTS ${MYSQL_DATABASE}_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON ${MYSQL_DATABASE}_test.* TO '\''${MYSQL_USER}'\''@'\''%'\''; FLUSH PRIVILEGES;"'
          docker compose exec -T php php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Validate Composer Symfony and schema
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T php composer validate --strict
          docker compose exec -T php composer audit --locked --no-dev
          docker compose exec -T php php bin/console lint:container --env=test
          docker compose exec -T php php bin/console doctrine:schema:validate --env=test

      - name: Run PHPStan
        run: docker compose exec -T php composer analyse

      - name: Check PHP style
        run: docker compose exec -T php composer cs:check

      - name: Run backend tests
        run: docker compose exec -T php php bin/phpunit

      - name: Show backend logs on failure
        if: failure()
        run: docker compose logs

      - name: Try enabling repository vulnerability alerts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method PUT repos/${{ github.repository }}/vulnerability-alerts
          gh api --method PUT repos/${{ github.repository }}/automated-security-fixes

      - name: Commit validated patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-apply-116.yml
          rm -rf .github/agent
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Harden security and maintainability boundaries"
          git push origin HEAD:agent/issue-116-hardening
