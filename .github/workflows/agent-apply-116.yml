          write('docs/application-data-key.md', r'''# Application data encryption key

`APP_DATA_KEY` protects Dropbox tokens and metadata-provider credentials at rest.
It is a deployment secret, not a password or passphrase.

## Generate it

Use exactly 32 random bytes, encoded as either Base64 or 64 hexadecimal characters:

```bash
openssl rand -base64 32
# or
openssl rand -hex 32
```

Arbitrary strings and placeholders are rejected deliberately. A production
installation must fail closed rather than silently deriving a predictable key.

## Operational rules

- Keep the production key outside the repository (`.env.prod.local`, a secret
  manager, or the platform's environment configuration).
- Back it up separately from the database. A database backup without this key
  cannot recover encrypted integration credentials.
- Do not casually change it: existing ciphertext was authenticated with the old
  key and cannot be decrypted by a new one.
- Key rotation therefore requires an explicit decrypt-with-old / encrypt-with-new
  migration. Do not replace the environment value first and hope to repair rows
  afterward.
- Development and test keys committed in this repository are intentionally
  public and must never be reused in production.
''')

          write('docs/development-tooling.md', r'''# Development tooling

## Frontend

npm is the supported package manager. `frontend/package-lock.json` is the single
lockfile and the same commands are used locally, in Docker and in CI:

```bash
cd frontend
npm ci
npm run lint
npm run test
npm run build
```

Do not regenerate or commit a Bun lockfile unless the project deliberately
changes package-manager policy.

## Backend quality gates

The backend uses PHPStan for static analysis and PHP-CS-Fixer as a deterministic
code-style gate. CI runs both in addition to PHPUnit and Symfony/Doctrine schema
validation:

```bash
cd backend
composer analyse
composer cs:check
```

The PHPStan baseline records pre-existing findings so new code cannot add debt
silently. Reduce the baseline opportunistically when touching existing code.
''')

