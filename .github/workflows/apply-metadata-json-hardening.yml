name: Apply Metadata JSON Hardening

on:
  push:
    branches:
      - feature/metadata-enrichment-74-closeout

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-metadata-json-hardening]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feature/metadata-enrichment-74-closeout

      - name: Patch only the two new metadata routes
        shell: python
        run: |
          from pathlib import Path

          path = Path('backend/src/Controller/ComicController.php')
          text = path.read_text()
          old = "        $data = json_decode($request->getContent(), true);\n        $data = is_array($data) ? $data : [];"
          new = "        $data = \\App\\Http\\JsonRequestDecoder::decode($request);"

          def patch_method(source: str, method: str, next_method: str) -> str:
              start = source.index(f'    public function {method}(')
              end = source.index(f'    public function {next_method}(', start)
              section = source[start:end]
              count = section.count(old)
              if count != 1:
                  raise SystemExit(f'{method}: expected exactly one legacy decoder, found {count}')
              section = section.replace(old, new, 1)
              return source[:start] + section + source[end:]

          text = patch_method(text, 'metadataCandidates', 'metadataRecord')
          text = patch_method(text, 'metadataRecord', 'metadataRefresh')
          path.write_text(text)

      - name: Verify exact patch and commit
        shell: bash
        run: |
          set -euo pipefail
          count=$(grep -c 'JsonRequestDecoder::decode($request)' backend/src/Controller/ComicController.php || true)
          if [ "$count" -lt 2 ]; then
            echo "Expected the two new metadata routes to use JsonRequestDecoder"
            exit 1
          fi
          git diff --check
          git diff -- backend/src/Controller/ComicController.php
          git config user.name "Integration Hardening"
          git config user.email "noreply@example.invalid"
          git add backend/src/Controller/ComicController.php
          git commit -m "Harden metadata command JSON decoding"
          git push origin HEAD:feature/metadata-enrichment-74-closeout
