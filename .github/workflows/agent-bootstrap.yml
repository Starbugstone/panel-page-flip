name: Agent Bootstrap

on:
  push:
    branches:
      - agent/issue-116-hardening

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify write path and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Verify hardening patch runner"
          git push origin HEAD:agent/issue-116-hardening
