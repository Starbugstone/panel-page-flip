name: Regenerate lockfile for eslint react refresh

on:
  push:
    branches:
      - chore/eslint-react-refresh-0.5.4

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: chore/eslint-react-refresh-0.5.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate package lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git commit -m "chore(frontend): regenerate package lock"
          git push

# Temporary branch-only workflow; removed after the lockfile commit.
